name: Build Website

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Build
        run: npm run build
      - name: Trigger cPanel site rebuild
        if: github.event_name == 'push' && env.CPANEL_REPO_TOKEN != ''
        env:
          CPANEL_REPO_TOKEN: ${{ secrets.CPANEL_REPO_TOKEN }}
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.CPANEL_REPO_TOKEN }}
          repository: Shadyelsawy536/cpanel
          event-type: website-updated
          client-payload: '{"source":"cafe-website","ref":"main"}'
