<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#111111" />
    <title>Page not found</title>
    <style>
      *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#f8f7f4;color:#171717;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.card{width:min(520px,100%);padding:40px;border:1px solid #e5e2dc;border-radius:24px;background:#fff;text-align:center;box-shadow:0 18px 50px rgba(0,0,0,.06)}.code{font-size:64px;font-weight:800;letter-spacing:-.06em;margin:0}.card h1{font-size:24px;margin:8px 0}.card p{color:#707070;line-height:1.6}.button{display:inline-block;margin-top:12px;padding:12px 18px;border-radius:12px;background:#111;color:#fff;text-decoration:none;font-weight:700}
    </style>
  </head>
  <body>
    <main class="card">
      <p class="code">404</p>
      <h1>Page not found</h1>
      <p>The page you requested doesn't exist. Return to the restaurant website.</p>
      <a class="button" href="/cafe-website/?restaurant=cafe">Back to website</a>
    </main>
  </body>
</html>
